<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="396" viewBox="0 0 1200 396" role="img" aria-labelledby="title desc">
  <title id="title">严谨中文科研写作</title>
  <desc id="desc">依据研究材料完成中文论文与报告的撰写、修订和审计。工作从材料与问题出发，形成论证主线，撰写或修订正文，再按任务范围核对与审计。</desc>
  <rect width="1200" height="396" rx="12" fill="#F3EFE7"/>
  <g id="project-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="55" fill="#66705C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" letter-spacing="2">CODEX SKILL</text>
    <text x="1136" y="55" text-anchor="end" fill="#62665D" font-size="22">中文论文 · 研究报告</text>
    <text x="59" y="156" fill="#1B1D1A" font-size="78" font-weight="650">严谨中文科研写作</text>
    <text x="64" y="213" fill="#454942" font-size="32">依据材料撰写，围绕证据修订。</text>
  </g>
  <path d="M64 252H1136" stroke="#CCC6BA" stroke-width="1.5"/>
  <g id="writing-process" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="500">
    <text x="78" y="324" fill="#1B1D1A">材料与问题</text>
    <text x="370" y="324" fill="#1B1D1A">论证主线</text>
    <text x="650" y="324" fill="#1B1D1A">撰写与修订</text>
    <text x="945" y="324" fill="#1B1D1A">核对与审计</text>
    <g fill="none" stroke="#66705C" stroke-width="2">
      <path d="M291 311H332M324 304L332 311L324 318"/>
      <path d="M559 311H600M592 304L600 311L592 318"/>
      <path d="M862 311H903M895 304L903 311L895 318"/>
    </g>
    <g id="evidence-brackets" fill="none" stroke="#9A4A2D" stroke-width="2.5">
      <path d="M70 292H60V338H70"/>
      <path d="M1133 292H1143V338H1133"/>
    </g>
  </g>
</svg>
